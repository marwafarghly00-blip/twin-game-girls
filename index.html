<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cartoon Twin AI</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle,#ff9ad5,#ff4fa3,#ff85c1);
  overflow: hidden;
  color: white;
}

/* 📱 Responsive layout */
@media (max-width: 900px) {
  #camera, #scanOverlay {
    width: 100%;
    height: 50%;
  }
  #result {
    width: 100%;
    height: 50%;
    top: 50%;
  }
}

@media (min-width: 901px) {
  #camera, #scanOverlay {
    width: 50%;
    height: 100%;
  }
  #result {
    width: 50%;
    height: 100%;
    right: 0;
  }
}

#camera {
  position: absolute;
  left: 0;
  top: 0;
  object-fit: cover;
  border-right: 4px solid white;
}

#scanOverlay {
  position: absolute;
  left: 0;
  pointer-events: none;
  display: none;
}

.grid {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image:
    linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 40px 40px;
}

.scan-line {
  position: absolute;
  width: 100%;
  height: 4px;
  background: linear-gradient(to right,#ff4fa3,#fff,#ff4fa3);
  box-shadow: 0 0 20px #ff69b4;
  animation: moveScan 2s linear infinite;
}

@keyframes moveScan {
  0% { top: 0%; }
  100% { top: 100%; }
}

#result {
  position: absolute;
  top: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#charBox {
  width: 80%;
  max-width: 400px;
  height: 400px;
  border-radius: 25px;
  border: 3px solid #fff;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 0 20px #250ca2;
}

#charBox img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#name {
  margin-top: 15px;
  font-size: 24px;
}

#comment {
  margin-top: 15px;
  font-size: 40px;
  background: rgba(255,255,255,0.85);
  color: black;
  padding: 10px 20px;
  border-radius: 20px;
}

button {
  margin-top: 25px;
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(45deg,#ff4fa3,#ff9ad5);
  color: white;
  cursor: pointer;
  box-shadow: 0 0 15px #ff69b4;
  display: none;
}
</style>
</head>

<body>

<video id="camera" autoplay muted playsinline></video>

<div id="scanOverlay">
  <div class="grid"></div>
  <div class="scan-line"></div>
</div>

<div id="result">
  <h1> Cartoon Twin AI</h1>
  <div id="charBox">👀 Ready</div>
  <h2 id="name">Show your face</h2>
  <p id="comment"></p>
  <button onclick="restart()">🔄 Start Again</button>
</div>

<!-- 🎧 audio elements -->
<audio id="voice"></audio>
<audio id="flipSound" src="audio/flip.mp3"></audio>

<!-- MediaPipe Face Mesh -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>
const video = document.getElementById("camera");
const scanOverlay = document.getElementById("scanOverlay");
const charBox = document.getElementById("charBox");
const nameText = document.getElementById("name");
const commentText = document.getElementById("comment");
const button = document.querySelector("button");

let interval;
let faceDetected = false;

// 🎭 characters list
const chars = [
  { name: "Nesreen ", img: "images/nesreen.jpeg",sound: "audio/nesreen.mp3", comment: "نسرين امين" },
  { name: "Radwa ", img: "images/radwa.jpg", sound: "audio/radwa.mp3", comment: "رضوى الشربيني" },
  { name: "angham", img: "images/angham.jpeg",sound: "audio/angham.mp3", comment: "أنغام" },
  { name: "bella", img: "images/bella.jpg",sound: "audio/bella.mp3", comment: "بيلا حديد" },
  { name: "elissa", img: "images/elissa.jpg",sound: "audio/elissa.mp3", comment: "إليسا" },
  { name: "fify", img: "images/fify.jpg",sound: "audio/fify.mp3", comment: "فيفي عبدة" },
  { name: "haifa", img: "images/haifa.jpg",sound: "audio/haifa.mp3", comment: "هيفا" },
  { name: "kyle", img: "images/kyle.jpg",sound: "audio/kyle.mp3", comment: "كايلي" },
  { name: "nancy", img: "images/nancy.jpg",sound: "audio/nancy.mp3", comment: "نانسي عجرم" },
  { name: "selena", img: "images/selena.jpg",sound: "audio/selena.mp3", comment: "سيلينا" },
  { name: "shreen", img: "images/shreen.jpg",sound: "audio/shreen.mp3", comment: "شيرين" },
  { name: "yasmin", img: "images/yasmin.jpg", comment: "ياسمين" }
];

// 🧠 MediaPipe Face Mesh setup
const faceMesh = new FaceMesh({
  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
  }
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(onFaceResults);

// Handle face detection results
function onFaceResults(results) {
  faceDetected = !!(results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0);
}

// 🎥 Start camera for ALL devices
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    video.play();

    async function processFrame() {
      await faceMesh.send({ image: video });
      requestAnimationFrame(processFrame);
    }
    processFrame();

  } catch (err) {
    alert("Camera access failed. Please allow camera permission.");
    console.error(err);
  }
}

startCamera();

// ⏱ start scanning process
function startScan() {
  if (!faceDetected) {
    nameText.innerText = "Please show your face 😊";
    setTimeout(startScan, 500);
    return;
  }

  scanOverlay.style.display = "block";
  nameText.innerText = "Scanning... 👀";

  setTimeout(() => {
    startAnimation();
  }, 2000);
}

// 🎰 shuffle characters animation
function startAnimation() {
  let count = 0;
  const flipSound = document.getElementById("flipSound");

  interval = setInterval(() => {
    let c = chars[Math.floor(Math.random() * chars.length)];
    charBox.innerHTML = `<img src="${c.img}">`;

    flipSound.currentTime = 0;
    flipSound.play();

    count++;

    if (count > 25) {
      clearInterval(interval);
      showResult();
    }
  }, 70);
}

// 🎯 show final result
function showResult() {
  scanOverlay.style.display = "none";

  let c = chars[Math.floor(Math.random() * chars.length)];

  charBox.innerHTML = `<img src="${c.img}">`;
  nameText.innerText = c.name;
  commentText.innerText = c.comment;

  const voice = document.getElementById("voice");

  if (c.sound) {
    voice.src = c.sound;
    voice.play();
  }

  button.style.display = "block";
}

// 🔄 restart the process
function restart() {
  button.style.display = "none";
  commentText.innerText = "";
  nameText.innerText = "Show your face";
  charBox.innerHTML = "👀 Ready";
  startScan();
}

// Start the first scan after camera loads
setTimeout(startScan, 1500);
</script>

</body>
</html>
